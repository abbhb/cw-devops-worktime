<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CW DevOps 工时填报配置</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="options-layout">
      <section class="panel options-panel">
        <h1>全局配置</h1>
        <p class="subtle">reviewer / firstReviewer 为必填，其他默认值可按接口要求调整。</p>

        <form id="settingsForm" class="settings-form">
          <div class="grid-row two-columns">
            <div>
              <label for="reviewerInput">reviewer</label>
              <input id="reviewerInput" name="reviewer" type="text" required />
            </div>
            <div>
              <label for="firstReviewerInput">firstReviewer</label>
              <input id="firstReviewerInput" name="firstReviewer" type="text" required />
            </div>
          </div>

          <div class="grid-row two-columns">
            <div>
              <label for="manHourInput">默认工时</label>
              <input id="manHourInput" name="manHour" type="number" min="0" step="0.5" />
            </div>
            <div>
              <label for="issueTypeInput">issueType</label>
              <input id="issueTypeInput" name="issueType" type="text" />
            </div>
          </div>

          <div>
            <label for="reportDateStrategyInput">日报文件日期策略</label>
            <select id="reportDateStrategyInput" name="reportDateStrategy">
              <option value="same-day">文件名日期就是当天日报（默认）</option>
              <option value="previous-day">文件名日期对应前一天工时</option>
            </select>
          </div>

          <div class="grid-row three-columns">
            <div>
              <label for="firstHourTypeIdInput">firstHourTypeId</label>
              <input id="firstHourTypeIdInput" name="firstHourTypeId" type="number" min="0" />
            </div>
            <div>
              <label for="secondHourTypeIdInput">secondHourTypeId</label>
              <input id="secondHourTypeIdInput" name="secondHourTypeId" type="number" min="0" />
            </div>
            <div>
              <label for="stepIdInput">stepId</label>
              <input id="stepIdInput" name="stepId" type="number" min="0" />
            </div>
          </div>

          <div>
            <label for="productIdInput">productId</label>
            <input id="productIdInput" name="productId" type="text" required />
          </div>

          <div>
            <label for="productLineIdInput">productLineId</label>
            <input id="productLineIdInput" name="productLineId" type="text" required />
          </div>

          <div class="grid-row three-columns">
            <div>
              <label for="customerIdInput">customerId</label>
              <input id="customerIdInput" name="customerId" type="text" />
            </div>
            <div>
              <label for="tenantIdInput">tenantId</label>
              <input id="tenantIdInput" name="tenantId" type="text" />
            </div>
            <div>
              <label for="statusInput">status</label>
              <input id="statusInput" name="status" type="text" />
            </div>
          </div>

          <div>
            <label for="baseUrlInput">接口域名</label>
            <input id="baseUrlInput" name="baseUrl" type="url" />
          </div>

          <div>
            <label for="historyLimitInput">最多保留历史记录数</label>
            <input id="historyLimitInput" name="historyLimit" type="number" min="1" step="1" />
          </div>

          <div class="inline-row actions-row">
            <button id="saveButton" class="primary-button" type="submit">保存配置</button>
            <button id="resetButton" type="button">恢复默认</button>
          </div>
        </form>

        <p id="saveStatus" class="subtle"></p>
      </section>
    </main>

    <script type="module" src="options.js"></script>
  </body>
</html>
